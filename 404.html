<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Halaman Tidak Ditemukan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkbg: '#0f172a', darkcard: '#1e293b' } } }
        }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body
  class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white min-h-screen flex items-center justify-center p-6">

    <!-- Preloader -->
    <style>
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        html.dark #preloader {
            background-color: #0f172a;
        }

        .loader-circle {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        .loader-text {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 800;
            color: #4f46e5;
            letter-spacing: 4px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        body.loading {
            overflow: hidden !important;
        }
    </style>

    <div id="preloader">
        <div class="loader-circle"></div>
        <div class="loader-text">MEMUAT...</div>
    </div>

    <script>
        document.body.classList.add('loading');
        function hidePreloader() {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                preloader.style.opacity = '0';
                setTimeout(function () {
                    preloader.style.display = 'none';
                    document.body.classList.remove('loading');
                }, 500);
            }
        }
        if (document.readyState === 'complete') {
            hidePreloader();
        } else {
            window.addEventListener('load', hidePreloader);
            // Safety timeout: sembunyikan preloader setelah 3 detik jika load event belum terpanggil
            setTimeout(hidePreloader, 3000);
        }
    </script>

  <div
    class="max-w-md w-full text-center space-y-8 bg-white dark:bg-gray-800 p-10 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700">

    <div class="flex justify-center">
      <div class="bg-blue-100 dark:bg-blue-900/30 p-5 rounded-full">
        <i data-lucide="search-x" class="w-16 h-16 text-blue-600 dark:text-blue-400"></i>
      </div>
    </div>

    <div class="space-y-3">
      <h1 class="text-7xl font-extrabold text-blue-600 dark:text-blue-500 tracking-tighter">404</h1>
      <h2 class="text-2xl font-bold tracking-tight">Halaman Tidak Ditemukan</h2>
      <p class="text-gray-500 dark:text-gray-400 leading-relaxed">
        Maaf, halaman yang Anda cari tidak tersedia atau telah dipindahkan. Pastikan URL sudah benar.
      </p>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 pt-4">
      <a href="index.html"
        class="flex-1 inline-flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg shadow-blue-200 dark:shadow-none active:scale-95">
        <i data-lucide="home" class="w-5 h-5"></i>
        Dashboard
      </a>
      <a href="login.html"
        class="flex-1 inline-flex items-center justify-center gap-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 font-bold py-3 px-6 rounded-xl transition-all active:scale-95">
        <i data-lucide="log-in" class="w-5 h-5"></i>
        Login
      </a>
    </div>

    <p class="text-xs text-gray-400 dark:text-gray-500 uppercase tracking-widest font-semibold pt-6">
      Sistem Absensi Digital
    </p>
  </div>

  <script>
    // Inisialisasi Lucide Icons
    lucide.createIcons();
  </script>
</body>

</html>
