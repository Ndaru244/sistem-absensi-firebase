<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Halaman Tidak Ditemukan</title>
  <link rel="stylesheet" href="assets/css/tailwind.css?v=9e638c7">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>

<body class="app-shell min-h-screen flex items-center justify-center p-6">

  <div id="preloader">
    <div class="loader-circle"></div>
    <div class="loader-text">Memuat</div>
  </div>

  <script>
    document.body.classList.add('loading');
    function hidePreloader() {
      const preloader = document.getElementById('preloader');
      if (preloader) {
        preloader.style.opacity = '0';
        setTimeout(() => {
          preloader.style.display = 'none';
          document.body.classList.remove('loading');
        }, 300);
      }
    }
    if (document.readyState === 'complete') hidePreloader();
    else {
      window.addEventListener('load', hidePreloader);
      setTimeout(hidePreloader, 3000);
    }
  </script>

  <div class="card max-w-md w-full text-center p-8 sm:p-10 space-y-6 animate-fade-in">
    <div class="w-14 h-14 bg-primary-50 dark:bg-primary-950 rounded-lg flex items-center justify-center mx-auto">
      <i data-lucide="search-x" class="w-7 h-7 text-primary-600 dark:text-primary-400"></i>
    </div>

    <div class="space-y-2">
      <p class="text-5xl font-semibold text-primary-600 dark:text-primary-400">404</p>
      <h1 class="text-lg font-semibold text-slate-900 dark:text-white">Halaman Tidak Ditemukan</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">
        Halaman yang Anda cari tidak tersedia atau telah dipindahkan.
      </p>
    </div>

    <div class="flex flex-col sm:flex-row gap-2 pt-2">
      <a href="/" class="btn-primary flex-1 py-2.5">
        <i data-lucide="home" class="w-4 h-4"></i> Dashboard
      </a>
      <a href="/login.html" class="btn-secondary flex-1 py-2.5">
        <i data-lucide="log-in" class="w-4 h-4"></i> Login
      </a>
    </div>

    <p class="text-xs text-slate-400 pt-2">SDN Sunter Agung 12 PG</p>
  </div>

  <script>lucide.createIcons();</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function () {});
}
</script>
</body>

</html>
