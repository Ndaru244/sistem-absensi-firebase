# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Firebase Config
        run: |
          cat <<EOF > ./assets/js/firebase/config.js
          import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
          import { getFirestore } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
          import { getAuth } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

          const firebaseConfig = ${{ secrets.FIREBASE_CONFIG }};

          const app = initializeApp(firebaseConfig);
          const db = getFirestore(app);
          const auth = getAuth(app);

          export { db, auth, app };
          EOF

      - name: Deploy to Firebase Hosting (Production)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ABSENSI_INTERNAL }}' > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json

          # Run deploy and capture output; allow non-zero exit temporarily
          deploy_output=$(npx -y firebase-tools deploy --only hosting --project absensi-internal 2>&1) || deploy_exit=$?

          # Always clean up credentials
          rm service-account.json

          echo "$deploy_output"

          # If deploy failed, check if it's the known "already active version" false-positive
          if [ "${deploy_exit:-0}" -ne 0 ]; then
            if echo "$deploy_output" | grep -q "is the current active version"; then
              echo "Site is already up-to-date with this version. Treating as success."
              exit 0
            else
              echo "Real deployment error occurred."
              exit $deploy_exit
            fi
          fi