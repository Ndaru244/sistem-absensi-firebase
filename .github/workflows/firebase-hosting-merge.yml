# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Firebase Config
        run: |
          cat <<EOF > ./assets/js/firebase/config.js
          import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
          import { getFirestore } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
          import { getAuth } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

          const firebaseConfig = ${{ secrets.FIREBASE_CONFIG }};

          const app = initializeApp(firebaseConfig);
          const db = getFirestore(app);
          const auth = getAuth(app);

          export { db, auth, app };
          EOF

      - name: Deploy to Firebase Hosting (Production)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ABSENSI_INTERNAL }}' > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          npx -y firebase-tools deploy --only hosting --project absensi-internal
          rm service-account.json