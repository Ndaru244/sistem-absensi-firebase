name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:css
      - name: Inject Firebase Config
        run: |
          cat <<EOF > ./assets/js/firebase/config.js
          import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
          import {
            initializeFirestore,
            persistentLocalCache,
            persistentMultipleTabManager,
          } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
          import { getAuth } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
          import { getStorage } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-storage.js";
          import { initSyncQueue } from "../utils/sync-queue.js";

          const firebaseConfig = ${{ secrets.FIREBASE_CONFIG }};

          const storageKey = '__absensi_firebase_state__';
          const existingState = globalThis[storageKey];

          const app = existingState?.app || (getApps().length ? getApps()[0] : initializeApp(firebaseConfig));
          const db = existingState?.db || initializeFirestore(app, {
            localCache: persistentLocalCache({
              tabManager: persistentMultipleTabManager(),
            }),
          });
          const auth = existingState?.auth || getAuth(app);
          const storage = existingState?.storage || getStorage(app);

          if (!existingState) {
            globalThis[storageKey] = { app, db, auth, storage };
          }

          initSyncQueue(db);

          export { db, auth, app, storage };
          EOF

      - name: Inject cache-bust version
        run: node scripts/inject-cache-version.js

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ABSENSI_INTERNAL }}
          projectId: absensi-internal
