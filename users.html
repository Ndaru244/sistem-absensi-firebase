<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Pengguna - SDN Sunter Agung 12 PG</title>
    <meta name="description" content="Kontrol akses pengguna, verifikasi akun, dan pengaturan role admin.">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="assets/css/tailwind.css?v=e2de285">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body class="app-shell">

    <div id="preloader">
        <div class="loader-circle"></div>
        <div class="loader-text">Memuat</div>
    </div>

    <script>
        document.body.classList.add('loading');
        function hidePreloader() {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                preloader.style.opacity = '0';
                setTimeout(() => {
                    preloader.style.display = 'none';
                    document.body.classList.remove('loading');
                }, 300);
            }
        }
        if (document.readyState === 'complete') hidePreloader();
        else {
            window.addEventListener('load', hidePreloader);
            setTimeout(hidePreloader, 3000);
        }
    </script>

    <div id="navbar-container"></div>

    <main class="app-main">
        <div class="page-header">
            <h1 class="page-title flex items-center gap-2">
                <i data-lucide="users" class="w-5 h-5 text-primary-600"></i>
                Manajemen Pengguna
            </h1>
            <p class="page-subtitle">Kelola hak akses, verifikasi akun guru, dan hapus pengguna tidak aktif.</p>
        </div>

        <div class="card overflow-hidden">
            <div class="card-header">
                <div class="input-icon w-full sm:w-72">
                    <i data-lucide="search"></i>
                    <input type="text" id="searchUser" placeholder="Cari nama atau email..." class="input">
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-xs text-slate-500">
                        Total: <span id="totalUsersCount" class="font-semibold text-slate-900 dark:text-white">0</span>
                    </span>
                    <button id="btnRefreshUsers" class="btn-primary btn-sm">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        <span id="refreshText">Refresh</span>
                    </button>
                </div>
            </div>

            <div class="table-wrap">
                <table class="data-table">
                    <thead class="hidden md:table-header-group">
                        <tr>
                            <th>Pengguna</th>
                            <th>Role</th>
                            <th class="text-center">Verifikasi</th>
                            <th class="text-right">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="4" class="p-8 text-center text-slate-400">
                                <div class="flex justify-center gap-1.5">
                                    <span class="h-1.5 w-1.5 bg-slate-400 rounded-full animate-pulse"></span>
                                    <span class="h-1.5 w-1.5 bg-slate-400 rounded-full animate-pulse"></span>
                                    <span class="h-1.5 w-1.5 bg-slate-400 rounded-full animate-pulse"></span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="card-footer text-center">
                <p class="text-xs text-slate-400 flex justify-center items-center gap-1">
                    <i data-lucide="lock" class="w-3 h-3"></i> Hanya Super Admin
                </p>
            </div>
        </div>
    </main>

    <script type="module">
        import { toggleTheme, initNavbar } from './assets/js/utils/ui.js?v=e2de285';
        import { initAuthGuard } from './assets/js/utils/auth-guard.js?v=e2de285';
        import { initNavbarProfile } from './assets/js/components/navbar.js?v=e2de285';

        window.toggleTheme = toggleTheme;
        initNavbar('users');
        initAuthGuard({ requireSuperAdmin: true });
        initNavbarProfile();

        await import('./assets/js/pages/users.js?v=e2de285');
    </script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function () {});
}
</script>
</body>

</html>
