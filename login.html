<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SDN Sunter Agung 12 PG</title>
    <meta name="description" content="Masuk ke sistem absensi SDN Sunter Agung 12 PG untuk mengelola kehadiran siswa secara real-time.">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <meta property="og:title" content="Login - SDN Sunter Agung 12 PG">
    <meta property="og:description" content="Akses manajemen kehadiran siswa berbasis Cloud.">
    <meta property="og:image" content="assets/images/logo.png">
    <link rel="stylesheet" href="assets/css/tailwind.css?v=fb1eddf">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body class="app-shell min-h-screen flex items-center justify-center p-4">

    <div id="preloader">
        <div class="loader-circle"></div>
        <div class="loader-text">Memuat</div>
    </div>

    <script>
        document.body.classList.add('loading');
        function hidePreloader() {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                preloader.style.opacity = '0';
                setTimeout(() => {
                    preloader.style.display = 'none';
                    document.body.classList.remove('loading');
                }, 300);
            }
        }
        if (document.readyState === 'complete') hidePreloader();
        else {
            window.addEventListener('load', hidePreloader);
            setTimeout(hidePreloader, 3000);
        }
    </script>

    <div class="card w-full max-w-sm animate-fade-in">
        <div class="card-body p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-lg bg-slate-100 dark:bg-slate-800 mb-4">
                    <img src="assets/images/logo.png" alt="Logo Absensi" class="w-12 h-12 object-contain">
                </div>
                <h1 class="text-xl font-semibold text-slate-900 dark:text-white">SDN Sunter Agung 12 PG</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Masuk untuk mengelola kehadiran siswa</p>
            </div>

            <div class="space-y-4">
                <form id="email-login-form" class="space-y-3">
                    <div>
                        <input id="email-input" type="email" placeholder="Email" class="input w-full" required>
                        <p id="email-error" class="mt-1 hidden text-sm text-red-600 dark:text-red-400"></p>
                    </div>
                    <div>
                        <div class="relative">
                            <input id="password-input" type="password" placeholder="Password" class="input w-full pr-10" required>
                            <button type="button" class="toggle-password absolute inset-y-0 right-0 flex items-center px-3 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200" data-target="password-input">
                                <i data-lucide="eye" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <p id="password-error" class="mt-1 hidden text-sm text-red-600 dark:text-red-400"></p>
                        <div class="mt-2 text-right">
                            <button type="button" id="btnForgotPassword" class="text-xs font-medium text-primary-600 hover:text-primary-700 dark:text-primary-400 dark:hover:text-primary-300">
                                Lupa password?
                            </button>
                        </div>
                    </div>
                    <button id="btnEmailLogin" type="submit" class="btn-primary w-full py-3 disabled:opacity-50 disabled:cursor-not-allowed">
                        Masuk dengan Email
                    </button>
                    <p id="form-error" class="hidden rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700 dark:border-red-800 dark:bg-red-950/30 dark:text-red-300"></p>
                    <p id="form-success" class="hidden rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm text-emerald-700 dark:border-emerald-800 dark:bg-emerald-950/30 dark:text-emerald-300"></p>
                </form>

                <div id="reset-password-modal" class="fixed inset-0 z-[80] hidden items-center justify-center bg-slate-900/50 p-4">
                    <div class="card w-full max-w-sm">
                        <div class="card-body p-5 space-y-4">
                            <div>
                                <h2 class="text-base font-semibold text-slate-900 dark:text-white">Reset Password</h2>
                                <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">Masukkan email akun Anda. Jika terdaftar, tautan reset akan dikirim.</p>
                            </div>
                            <div>
                                <input id="reset-email-input" type="email" placeholder="Email" class="input w-full">
                                <p id="reset-email-error" class="mt-1 hidden text-sm text-red-600 dark:text-red-400"></p>
                            </div>
                            <div class="flex gap-2">
                                <button type="button" id="btnResetCancel" class="btn-secondary flex-1">Batal</button>
                                <button type="button" id="btnResetSend" class="btn-primary flex-1">Kirim</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center text-xs text-slate-400">atau</div>

                <button id="btnGoogleLogin"
                    class="btn-secondary w-full py-3 disabled:opacity-50 disabled:cursor-not-allowed">
                    <img id="g-logo" src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png"
                        class="w-5 h-5" alt="Google Logo">
                    <div id="loader-icon" class="hidden w-5 h-5 border-2 border-slate-300 border-t-primary-600 rounded-full animate-spin"></div>
                    <span id="btn-text">Masuk dengan Google</span>
                </button>

                <div id="status-message" class="hidden text-center text-sm">
                    <div class="flex items-center justify-center gap-2 text-primary-600 dark:text-primary-400">
                        <div class="w-4 h-4 border-2 border-primary-600 border-t-transparent rounded-full animate-spin"></div>
                        <span id="status-text">Memverifikasi...</span>
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-slate-200 dark:border-slate-800 text-center">
                <p class="text-xs text-slate-400 flex justify-center items-center gap-1">
                    <i data-lucide="life-buoy" class="w-3 h-3"></i> IT Support Absensi
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initAuthGuard } from './assets/js/utils/auth-guard.js?v=fb1eddf';
        import authServiceModule from './assets/js/firebase/auth-service.js?v=fb1eddf';
        import { auth } from './assets/js/firebase/config.js?v=fb1eddf';

        const authService = authServiceModule;

        initAuthGuard({ preventLoginAccess: true });
        lucide.createIcons();

        const btn = document.getElementById('btnGoogleLogin');
        const btnText = document.getElementById('btn-text');
        const loader = document.getElementById('loader-icon');
        const gLogo = document.getElementById('g-logo');
        const statusMessage = document.getElementById('status-message');
        const statusText = document.getElementById('status-text');
        const emailForm = document.getElementById('email-login-form');
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const btnEmailLogin = document.getElementById('btnEmailLogin');
        const emailError = document.getElementById('email-error');
        const passwordError = document.getElementById('password-error');
        const formError = document.getElementById('form-error');
        const formSuccess = document.getElementById('form-success');
        const btnForgotPassword = document.getElementById('btnForgotPassword');
        const resetModal = document.getElementById('reset-password-modal');
        const resetEmailInput = document.getElementById('reset-email-input');
        const resetEmailError = document.getElementById('reset-email-error');
        const btnResetCancel = document.getElementById('btnResetCancel');
        const btnResetSend = document.getElementById('btnResetSend');
        const toggleButtons = document.querySelectorAll('.toggle-password');
        let isProcessing = false;
        let isResetting = false;

        function clearFieldErrors() {
            emailError.classList.add('hidden');
            passwordError.classList.add('hidden');
            formError.classList.add('hidden');
            formSuccess.classList.add('hidden');
            emailError.textContent = '';
            passwordError.textContent = '';
            formError.textContent = '';
            formSuccess.textContent = '';
        }

        function showFieldError(field, message) {
            const errorEl = field === 'email' ? emailError : passwordError;
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }

        function showFormError(message) {
            formSuccess.classList.add('hidden');
            formSuccess.textContent = '';
            formError.textContent = message;
            formError.classList.remove('hidden');
        }

        function showFormSuccess(message) {
            formError.classList.add('hidden');
            formError.textContent = '';
            formSuccess.textContent = message;
            formSuccess.classList.remove('hidden');
        }

        function openResetModal() {
            resetEmailError.classList.add('hidden');
            resetEmailError.textContent = '';
            resetEmailInput.value = emailInput.value.trim();
            resetModal.classList.remove('hidden');
            resetModal.classList.add('flex');
            setTimeout(() => resetEmailInput.focus(), 50);
        }

        function closeResetModal() {
            resetModal.classList.add('hidden');
            resetModal.classList.remove('flex');
            resetEmailError.classList.add('hidden');
            resetEmailError.textContent = '';
            btnResetSend.disabled = false;
            btnResetSend.textContent = 'Kirim';
        }

        toggleButtons.forEach((button) => {
            button.addEventListener('click', () => {
                const targetId = button.getAttribute('data-target');
                const targetInput = document.getElementById(targetId);
                if (!targetInput) return;

                const isPassword = targetInput.type === 'password';
                targetInput.type = isPassword ? 'text' : 'password';
                const icon = button.querySelector('i');
                if (icon) {
                    icon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
                    if (window.lucide) {
                        window.lucide.createIcons();
                    }
                }
            });
        });

        btnForgotPassword.addEventListener('click', () => {
            if (isProcessing || isResetting) return;
            openResetModal();
        });

        btnResetCancel.addEventListener('click', () => {
            if (isResetting) return;
            closeResetModal();
        });

        resetModal.addEventListener('click', (event) => {
            if (event.target === resetModal && !isResetting) closeResetModal();
        });

        btnResetSend.addEventListener('click', async () => {
            if (isResetting) return;

            const email = resetEmailInput.value.trim();
            resetEmailError.classList.add('hidden');
            resetEmailError.textContent = '';

            if (!email) {
                resetEmailError.textContent = 'Email wajib diisi.';
                resetEmailError.classList.remove('hidden');
                return;
            }

            isResetting = true;
            btnResetSend.disabled = true;
            btnResetSend.textContent = 'Mengirim...';

            try {
                const result = await authService.sendPasswordReset(email);
                closeResetModal();
                showFormSuccess(result.message || 'Jika email terdaftar, tautan reset password telah dikirim.');
            } catch (error) {
                resetEmailError.textContent = error.message || 'Gagal mengirim tautan reset password.';
                resetEmailError.classList.remove('hidden');
                btnResetSend.disabled = false;
                btnResetSend.textContent = 'Kirim';
            } finally {
                isResetting = false;
            }
        });

        emailForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (isProcessing) return;

            clearFieldErrors();

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email) {
                showFieldError('email', 'Email wajib diisi.');
                return;
            }
            if (!password) {
                showFieldError('password', 'Password wajib diisi.');
                return;
            }

            isProcessing = true;
            setLoading(true, 'Masuk dengan email...');

            try {
                const userData = await authService.loginWithEmailPassword(email, password);
                if (!userData) throw new Error('Gagal mendapatkan data user');
                await redirectAfterLogin(userData);
            } catch (error) {
                console.error('Email login error:', error);
                showFormError(error.message || 'Gagal masuk. Silakan coba lagi.');
                resetBtn();
                isProcessing = false;
            }
        });

        btn.addEventListener('click', async () => {
            if (isProcessing) return;
            isProcessing = true;
            setLoading(true, "Membuka jendela login...");

            try {
                const userData = await authService.loginWithGoogle();
                if (!userData) throw new Error('Gagal mendapatkan data user');
                await redirectAfterLogin(userData);
            } catch (error) {
                if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
                    console.error('Login error:', error);
                    showFormError(error.message || 'Gagal masuk dengan Google.');
                }
                resetBtn();
                isProcessing = false;
            }
        });

        async function redirectAfterLogin(userData) {
            setLoading(true, "Memverifikasi akun...");

            if (userData.role === 'admin' || userData.role === 'super_admin') {
                setLoading(true, "Menuju Admin Panel...");
                await new Promise(resolve => setTimeout(resolve, 300));
                window.location.replace('admin.html');
            } else if (userData.isVerified || userData.role === 'guru') {
                setLoading(true, "Menuju Dashboard...");
                await new Promise(resolve => setTimeout(resolve, 300));
                window.location.replace('index.html');
            } else {
                showFormError('Akun belum diverifikasi Admin.');
                await authService.logout();
                resetBtn();
                isProcessing = false;
            }
        }

        function setLoading(show, message = "Memproses...") {
            btn.disabled = show;
            btnEmailLogin.disabled = show;
            if (show) {
                btnText.innerText = message;
                gLogo.classList.add('hidden');
                loader.classList.remove('hidden');
                statusMessage.classList.remove('hidden');
                statusText.innerText = message;
            } else {
                btnText.innerText = "Masuk dengan Google";
                gLogo.classList.remove('hidden');
                loader.classList.add('hidden');
                statusMessage.classList.add('hidden');
            }
        }

        function resetBtn() { setLoading(false); }

        ['admin.html', 'index.html'].forEach(href => {
            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = href;
            document.head.appendChild(link);
        });
    </script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function () {});
}
</script>
</body>

</html>
